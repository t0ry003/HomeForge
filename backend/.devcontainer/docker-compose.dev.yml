services:
  backend:
    # NOTE: We intentionally do NOT use `network_mode: host` here.
    # On Docker Desktop (macOS/Windows) host mode binds to the internal Linux VM,
    # not the physical LAN, so it neither exposes ports to your network nor lets
    # mDNS reach real devices — and it also breaks `db` hostname resolution.
    # Bridge networking with explicit published ports works everywhere for the
    # manual `server_ip` / `/config` device-connection fallbacks.
    # (True mDNS zero-config discovery only works on a native Linux host such as a
    # Raspberry Pi — see deploy/docker-compose.prod.yml.)
    ports:
      - "8000:8000"   # Django API
      - "1883:1883"   # Mosquitto MQTT broker (REQUIRED for devices to connect)
    command: sleep infinity
  frontend:
    command: sleep infinity